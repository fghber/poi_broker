{# Local QueryBuilder 3.0.0 CSS. Do not add a jsDelivr CDN/SRI fallback: jsDelivr may re-minify and break integrity. #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/query-builder.default.min.css') }}">
<style>
    .query-builder-widget [data-role="builder"] {
        margin-bottom: 20px;
    }

    .query-builder-widget [data-role="results"] {
        margin-top: 20px;
    }

    .query-builder-widget pre {
        min-height: 48px;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .query-builder-widget.modal-layout pre {
        max-height: 160px;
    }

    .watchlist-query-modal .modal-body {
        max-height: calc(100vh - 220px);
        overflow-y: auto;
    }

    .watchlist-query-modal .modal-dialog {
        max-width: 1140px;
    }

    .watchlist-list .list-group-item {
        align-items: flex-start;
    }

    .watchlist-list .watchlist-sql {
        font-family: monospace;
        font-size: 0.875rem;
        white-space: pre-wrap;
        word-break: break-word;
    }

    /* QueryBuilder may emit BS3/BS4/BS5-style float utility classes */
    .query-builder-widget .query-builder .pull-right,
    .query-builder-widget .query-builder .float-right,
    .query-builder-widget .query-builder .float-end {
        float: right !important;
    }
</style>
