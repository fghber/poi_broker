# Supervisord configuration for the POI Broker Huey worker.
#
# This is a portable alternative to the systemd unit (deploy/poi-broker-huey.service)
# and works on any host with supervisord installed. It restarts the worker if it
# exits, so a crash cannot leave exports permanently stuck.
#
# Install:
#   - Place this as /etc/supervisor/conf.d/poi-broker-huey.conf (Debian/Ubuntu)
#     or append to supervisord.conf.
#   - Ensure the environment variables below are set (use environment= or point
#     at an env file via environment=read from a file — supervisord 4+ supports
#     `environment=%(ENV_...)` or an env file referenced by `environment:`).
#
# IMPORTANT: point the consumer at poi_broker.worker.huey so tasks register on
# the shared Huey instance.

[program:poi-broker-huey]
command=/opt/poi_broker/.venv/bin/python -m huey.bin.huey_consumer poi_broker.worker.huey --workers=2 --worker-type=thread --logfile=/var/log/poi_broker/huey.log --verbose
directory=/opt/poi_broker
user=poi-broker
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/poi_broker/huey.out.log
stderr_logfile=/var/log/poi_broker/huey.err.log
environment=SECRET_KEY="CHANGE_ME",ALERTS_DB_PATH="/var/lib/poi_broker/ztf_alerts_stream.db",USERS_DB_PATH="/var/lib/poi_broker/users.db",HUEY_BACKEND="sqlite",HUEY_SQLITE_PATH="/var/lib/poi_broker/huey.db",HUEY_THREADS="2"