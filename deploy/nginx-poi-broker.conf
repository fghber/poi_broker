# Nginx site configuration for POI Broker.
#
# Install:
#   1. Place this file at /etc/nginx/sites-available/poi-broker
#   2. sudo ln -s /etc/nginx/sites-available/poi-broker /etc/nginx/sites-enabled/
#   3. sudo nginx -t
#   4. sudo systemctl reload nginx
#
# The app runs behind Gunicorn on 127.0.0.1:8000. The X-Forwarded-* headers are
# REQUIRED: poi_broker/__init__.py enables ProxyFix (x_for=1, x_proto=1, x_host=1)
# in production so url_for(..., _external=True) and secure cookies work correctly.

server {
    listen 80;
    server_name poibroker.example.com;

    # Optional: redirect HTTP -> HTTPS (see TLS section in PRODUCTION_DEPLOYMENT.md)
    # return 301 https://$host$request_uri;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;   # allow long-running export requests
        proxy_send_timeout 60s;
    }

    # Static assets can be served directly by Nginx for performance.
    location /static/ {
        alias /opt/poi_broker/poi_broker/static/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
